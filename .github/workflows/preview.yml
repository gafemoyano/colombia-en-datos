name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Only run on PRs from branches within this repo (forks don't have FLY_API_TOKEN)
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy preview
        uses: superfly/fly-pr-review-apps@1
        with:
          name: colombia-en-datos-preview-pr-${{ github.event.number }}
          config: fly.preview.toml
          region: iad
          secrets: |
            DATABASE_URL=${{ secrets.PREVIEW_DATABASE_URL }}
            TURSO_AUTH_TOKEN=${{ secrets.PREVIEW_DATABASE_TOKEN }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
